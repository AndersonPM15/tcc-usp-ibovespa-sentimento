[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-ibovespa-sentimento"
version = "1.1.0"
description = "Reprodução do artigo 'Análise do Sentimento de Notícias e seu Efeito no Ibovespa' (XXIX SemeAd, 2026)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Anderson Pantoja Machado" }]
# Versões de reprodução (2026): fixadas para que os números do artigo saiam idênticos.
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "python-dotenv==1.2.4",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "statsmodels==0.15.0",
]

[project.optional-dependencies]
# Etapas que acessam a internet: coleta GDELT, download do Ibovespa e stopwords do NLTK.
pipeline = ["nltk==3.10.3", "requests==2.34.2", "yfinance==1.7.0"]
dev = [
    "mypy==2.4.0",
    "pandas-stubs==2.3.3.260113",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "types-requests==2.33.0.20261006",
    "vulture==2.16",
]

[project.scripts]
tcc = "tcc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tcc = ["reference/*.csv", "reference/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",    # bugbear: armadilhas comuns
    "C4",   # comprehensions
    "D",    # docstrings (convenção Google)
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # ordem dos imports
    "N",    # nomes (PEP 8)
    "PIE",  # construções desnecessárias
    "PTH",  # pathlib em vez de os.path
    "RET",  # retornos
    "RUF",  # regras do ruff
    "SIM",  # simplificações
    "UP",   # sintaxe moderna
    "W",    # avisos de estilo
]
ignore = [
    "E501",    # comprimento de linha fica a cargo do formatador
    "RUF001",  # textos em português usam "–", "×" e "−" de propósito
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # os nomes dos testes descrevem o que verificam

[tool.mypy]
python_version = "3.11"
files = ["src/tcc"]
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# bibliotecas científicas sem anotações de tipo publicadas
module = ["sklearn.*", "scipy.*", "statsmodels.*", "yfinance.*", "nltk.*"]
ignore_missing_imports = true

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 60

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
